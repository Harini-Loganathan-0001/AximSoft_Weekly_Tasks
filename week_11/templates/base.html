<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Sentiment Analysis{% endblock %}</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <style>
    body {
        background-image:
            linear-gradient(
                rgba(0, 0, 0, 0.6),
                rgba(0, 0, 0, 0.6)
            ),
            url("{{ url_for('static', filename='images/sentiment-bg.png') }}");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        min-height: 100vh;
        color: #f5f5f5;
        font-family: 'Poppins', 'Inter', sans-serif;
    }

    /* .card {
        background-color: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        padding: 20px;
    } */

</style>

</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
    <div class="container-fluid px-5">

        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link fw-bold" href="/">
                    Sentiment Analysis
                </a>
            </li>
        </ul>


        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
        >
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">



                <li class="nav-item">
                    <a class="nav-link" href="/prediction">
                        Prediction
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/comparison">
                        Model Comparison
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/analytics">
                        Text Analytics
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/batch-prediction">
                        Batch Prediction
                    </a>
                </li>

            </ul>

        </div>
    </div>
</nav>

<!-- ================= PAGE CONTENT ================= -->

<main>
    {% block content %}
    {% endblock %}
</main>

<!-- Bootstrap JS -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
