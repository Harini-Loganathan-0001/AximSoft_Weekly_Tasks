{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

<div class="col-md-5">

<div class="card shadow-lg p-4">

<h2 class="text-center mb-4">

Login

</h2>

<form method="POST">

{{ form.hidden_tag() }}

<div class="mb-3">

{{ form.email.label }}

{{ form.email(class="form-control") }}

</div>

<div class="mb-3">

{{ form.password.label }}

{{ form.password(class="form-control") }}

</div>

<div class="d-grid">

{{ form.submit(class="btn btn-success") }}

</div>

</form>

</div>

</div>

</div>

{% endblock %}
