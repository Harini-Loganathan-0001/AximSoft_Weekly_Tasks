{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h3 class="mb-3">
        Resume - {{ application.candidate.name }}
    </h3>

    <iframe
        src="{{ url_for('static', filename='uploads/resumes/' + application.candidate.resume) }}"
        width="100%"
        height="800px"
        style="border:1px solid #ccc;">
    </iframe>

</div>

{% endblock %}
