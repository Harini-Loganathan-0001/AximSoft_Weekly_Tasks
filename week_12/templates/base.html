<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}AI Customer Intelligence Platform{% endblock %}
    </title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <aside class="col-md-3 col-lg-2 sidebar position-fixed top-0 start-0 vh-100 p-0">

            <div class="p-4 border-bottom">
                <h5 class="fw-bold mb-1 text-white">
                    AI Customer
                </h5>

                <small class="text-dark fw-bold">
                    Intelligence Platform
                </small>
            </div>

            <nav class="nav flex-column p-3 text-dark">

                <a href="{{ url_for('dashboard') }}" class="nav-link">
                     Dashboard
                </a>

                <a href="{{ url_for('customer_profile') }}" class="nav-link">
                     Customer Profile
                </a>

                <a href="{{ url_for('churn_explanation') }}" class="nav-link" >
                     Churn & Explanation
                </a>

                <a href="{{ url_for('knowledge_search') }}" class="nav-link" >
                     Knowledge Search
                </a>

                <a href="{{ url_for('ai_assistant') }}" class="nav-link" >
                     AI Assistant
                </a>

                <a href="{{ url_for('analytics') }}"class="nav-link">
                    Analytics
                </a>

            </nav>

        </aside>


        <!-- Main Content -->
        <main class="col-md-9 col-lg-10 offset-md-3 offset-lg-2 p-4">

            {% block content %}
            {% endblock %}

        </main>

    </div>
</div>

</body>
</html>
