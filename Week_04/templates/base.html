<!DOCTYPE html>
<html>
<head>
    <title>Course System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">

    <style>
        /* Prevent content from hiding behind fixed navbar */
        body {
            padding-top: 70px; /* adjust based on navbar height */
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top shadow"
     style="background-color:#103359;">
         <div class="container">

        <a class="navbar-brand" href="{{ url_for('home') }}">
            🌐 Learnityx
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">

                {% if current_user.is_authenticated %}
                    <!-- Show when logged in -->
                    <li class="nav-item me-2">
                        <a href="{{ url_for('courses') }}" class="btn btn-outline-light">Courses</a>
                    </li>
                    <li class="nav-item me-2">
                        <a href="{{ url_for('my_courses') }}" class="btn btn-outline-light">My Courses</a>
                    </li>
                    <li class="nav-item me-2">
                        <a href="{{ url_for('profile') }}" class="btn btn-outline-light">Profile</a>
                    </li>
                    <li class="nav-item">
                        <a href="{{ url_for('logout') }}" class="btn btn-danger">Logout</a>
                    </li>
                {% else %}
                    <!-- Show when NOT logged in -->
                    <li class="nav-item me-2">
                        <a href="{{ url_for('login') }}" class="btn btn-outline-light">Login</a>
                    </li>
                    <li class="nav-item me-2">
                        <a href="{{ url_for('register') }}" class="btn btn-outline-light">Sign Up</a>
                    </li>
                    <li class="nav-item me-2">
                        <a href="{{ url_for('courses') }}" class="btn btn-outline-light">Courses</a>
                    </li>
                {% endif %}

            </ul>
        </div>

    </div>
</nav>

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
