<!DOCTYPE html>
<html lang="en">
 
<head>
    <meta charset="UTF-8">

 
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
 
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 
    <link href="https://fonts.googleapis.com/css2?family=Montenegrin+Gothic+One&display=swap" rel="stylesheet">
 
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
 
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet"
href="{{ url_for('static',filename='css/print.css') }}">
</head>
 
<body>
 
    <!-- NAVBAR -->
<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark topnav">
  <div class="container-fluid">

    <!-- Toggler -->
    <button class="navbar-toggler ms-auto"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
     <!-- Left side -->
<ul class="navbar-nav">
  <li class="nav-item me-4">
    <a class="navbar-brand d-flex align-items-center gap-2"
       href="{{ url_for('home') }}">
      <i class="bi bi-bar-chart-fill"></i> Analytics Hub
    </a>
  </li>
</ul>


      <!-- Right side -->
      <ul class="navbar-nav ms-auto d-flex align-items-center flex-nowrap">
        <li class="nav-item"><a class="nav-link" href="/booking-analytics">Booking Analytics</a></li>
        <li class="nav-item"><a class="nav-link" href="/customer-analytics">Customer Analytics</a></li>
        <li class="nav-item"><a class="nav-link" href="/revenue-analytics">Revenue Analytics</a></li>
        <li class="nav-item"><a class="nav-link" href="/statistical-analysis">Statistical Analytics</a></li>
        <li class="nav-item"><a class="nav-link" href="/data-explorer">Data Explorer</a></li>
        <li class="nav-item"><a class="nav-link" href="/reports">Reports</a></li>
        <li class="nav-item">
          <a class="nav-link d-flex align-items-center gap-2" href="#">
            <img src="{{ url_for('static', filename='images/admin.png') }}"
                 width="35"
                 class="rounded-circle">
            <span>Admin</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>



    
 
    <!-- PAGE CONTENT -->
    {% block content %}
    {% endblock %}
 
    <!-- FOOTER -->
    <footer class="dashboard-footer text-center py-3">
        © 2026 Hotel Booking Analytics Dashboard
    </footer>
 
    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
 
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
 
    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>


    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-treemap@2.3.0/dist/chartjs-chart-treemap.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>

{% block scripts %}
{% endblock %}

 
</body>
</html>
